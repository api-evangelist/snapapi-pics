    type: Documentation
  - url: openapi/snapapi-pics-openapi.json
    type: OpenAPI
  description: Capture pixel-perfect screenshots of any web page via POST or GET /v1/screenshot
    in PNG, JPEG, WebP, or AVIF, with full-page capture, device emulation, dark mode,
    ad/tracker/cookie-banner blocking, and custom CSS/JS injection. Process up to 100
    URLs at once with POST /v1/screenshot/batch, and poll batch or async jobs by jobId.
