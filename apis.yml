aid: snapapi-pics
url: https://raw.githubusercontent.com/api-evangelist/snapapi-pics/refs/heads/main/apis.yml
name: SnapAPI
kind: company
description: SnapAPI is a REST API for turning any URL into visual captures or structured
  data with a single call - screenshots (PNG, JPEG, WebP, AVIF), full-page PDFs, scroll
  videos (MP4, WebM, GIF), markdown/text/metadata extraction tuned for AI pipelines,
  and multi-page scraping with anti-bot stealth and proxy support. It also offers
  BYOK AI page analysis (OpenAI/Anthropic), batch and async processing with webhooks,
  device emulation, ad/cookie-banner blocking, caching, and optional cloud storage,
  all powered by headless Chromium. Free tier of 200 requests/month, no credit card
  required, with X-Api-Key authentication and eight official SDKs.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Screenshots
